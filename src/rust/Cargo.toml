# Cargo.toml da crate Rust do kernel TipOS. Compila como staticlib (.a)
# pra linkar direto no kernel.elf. Sem std, só core + alloc.
[package]
name = "tipos-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "tipos_rust"

[dependencies]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
debug = false
